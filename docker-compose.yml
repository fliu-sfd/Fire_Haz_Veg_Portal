# Local development stack.
#   docker compose up -d db   database only (run the API yourself with uv)
#   docker compose up --build database + API; the API applies migrations and
#                             imports the NAOS file from ./data if it is there
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fhv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fhv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fhv_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fire_hazard_veg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01_extensions.sql:/docker-entrypoint-initdb.d/20_project_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: fhv-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fhv}:${POSTGRES_PASSWORD:-fhv_dev_pw}@db:5432/${POSTGRES_DB:-fire_hazard_veg}
      PHOTO_STORAGE_DIR: /app/photo_storage
      AUTO_IMPORT: ${AUTO_IMPORT:-true}
      NAOS_SEASON_YEAR: ${NAOS_SEASON_YEAR:-2026}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - photos:/app/photo_storage
      - ${NAOS_DATA_DIR:-./data}:/data:ro

  frontend:
    build: ./frontend
    container_name: fhv-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
  photos:
