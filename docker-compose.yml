# Local development database: PostgreSQL 16 with the PostGIS extension.
# Start it with:  docker compose up -d db
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fhv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fhv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fhv_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fire_hazard_veg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01_extensions.sql:/docker-entrypoint-initdb.d/20_project_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
